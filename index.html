<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sajeesh C - Mobile Game Developer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #12131c;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #a0aec0;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .game-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px;
      border-radius: 18px;
      margin-bottom: 24px;
      text-align: left;
    }
    .game-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #06d6a0, #118ab2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .game-info h2 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 3px;
    }
    .game-info p {
      font-size: 12px;
      color: #cbd5e0;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #06d6a0, #00b4d8);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffd166;
    }
    .btn:active { transform: scale(0.97); }
    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #718096;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sajeesh C</h1>
    <p class="subtitle">Android Game Developer</p>

    <div class="game-badge">
      <div class="game-icon">🧱</div>
      <div class="game-info">
        <h2>Stack Tower</h2>
        <p>Isometric 3D block stacking arcade game</p>
      </div>
    </div>

    <div class="links">
      <a href="https://sajeeshc.github.io/stacktower/" class="btn btn-secondary">Privacy Policy - Stack Tower</a>
      <a href="/app-ads.txt" class="btn btn-secondary">Authorized app-ads.txt</a>
    </div>

    <footer>
      &copy; 2026 Sajeesh C. All rights reserved.
    </footer>
  </div>
</body>
</html>
